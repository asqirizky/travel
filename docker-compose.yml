services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-app
    working_dir: /var/www
    restart: unless-stopped
    ports:
      # Opsional: hanya dipakai kalau menjalankan `php artisan serve` manual.
      - "8000:8000"
    volumes:
      - .:/var/www
      - vendor-data:/var/www/vendor
      - node-modules:/var/www/node_modules
      - ./docker/php/upload-limit.ini:/usr/local/etc/php/conf.d/upload-limit.ini:ro
    environment:
      # Override .env: dari dalam container MySQL diakses lewat nama service.
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel
      MYSQL_USER: travel
      MYSQL_PASSWORD: secret
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-vite
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - .:/var/www
      - vendor-data:/var/www/vendor
      - node-modules:/var/www/node_modules
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "5173:5173"
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do echo 'Menunggu dependency PHP...'; sleep 2; done;
             [ -d node_modules/vite ] || npm ci;
             npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: travel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  vendor-data:
  node-modules:
